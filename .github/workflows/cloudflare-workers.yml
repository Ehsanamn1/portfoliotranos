name: Deploy Tranos to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: "cortex 1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

      - name: Build OpenNext for Cloudflare
        run: npm run build:cloudflare

      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CF_TOKEN}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN in environment 'cortex 1'."; exit 1; }
          test -n "${CF_ACCOUNT_ID}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID in environment 'cortex 1'."; exit 1; }
          echo "Cloudflare credentials are present."

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Set production secrets when configured
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${DATABASE_URL}" ]; then
            printf '%s' "${DATABASE_URL}" | npx wrangler secret put DATABASE_URL
          fi

          if [ -n "${ADMIN_EMAIL}" ]; then
            printf '%s' "${ADMIN_EMAIL}" | npx wrangler secret put ADMIN_EMAIL
          fi

          if [ -n "${ADMIN_PASSWORD}" ]; then
            printf '%s' "${ADMIN_PASSWORD}" | npx wrangler secret put ADMIN_PASSWORD
          fi
