name: Deploy Tranos to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tranos-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: "cortex 1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

      - name: Build OpenNext for Cloudflare
        run: npm run build:cloudflare

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Apply production migrations and seed CMS
        if: ${{ secrets.DATABASE_URL != '' && secrets.ADMIN_PASSWORD != '' }}
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Set production secrets
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${DATABASE_URL}" ]; then printf '%s' "${DATABASE_URL}" | npx wrangler secret put DATABASE_URL; fi
          if [ -n "${ADMIN_EMAIL}" ]; then printf '%s' "${ADMIN_EMAIL}" | npx wrangler secret put ADMIN_EMAIL; fi
          if [ -n "${ADMIN_PASSWORD}" ]; then printf '%s' "${ADMIN_PASSWORD}" | npx wrangler secret put ADMIN_PASSWORD; fi
