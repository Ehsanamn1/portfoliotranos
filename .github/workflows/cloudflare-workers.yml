name: Deploy Tranos to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tranos-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

      - name: Build OpenNext for Cloudflare
        run: npm run build:cloudflare

      - name: Detect Cloudflare credentials
        id: cf
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CF_TOKEN}" ] && [ -n "${CF_ACCOUNT_ID}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare account credentials are available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare permanent-account credentials are not configured; using a temporary preview only for CI verification."
          fi

      - name: Apply database migrations and seed CMS
        if: steps.cf.outputs.available == 'true'
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL}" ] || [ -z "${ADMIN_PASSWORD}" ]; then
            echo "Production database credentials are not configured; skipping migration/seed."
            exit 0
          fi
          npx prisma migrate deploy
          npx prisma db seed

      - name: Deploy to permanent Cloudflare account
        if: steps.cf.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Temporary preview deployment
        if: steps.cf.outputs.available != 'true'
        shell: bash
        run: |
          npx wrangler deploy --temporary

      - name: Set production secrets
        if: steps.cf.outputs.available == 'true'
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${DATABASE_URL}" ]; then printf '%s' "${DATABASE_URL}" | npx wrangler secret put DATABASE_URL; fi
          if [ -n "${ADMIN_EMAIL}" ]; then printf '%s' "${ADMIN_EMAIL}" | npx wrangler secret put ADMIN_EMAIL; fi
          if [ -n "${ADMIN_PASSWORD}" ]; then printf '%s' "${ADMIN_PASSWORD}" | npx wrangler secret put ADMIN_PASSWORD; fi
