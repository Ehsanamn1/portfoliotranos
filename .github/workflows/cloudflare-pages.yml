name: Deploy Tranos Studio to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: "cortex 1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CF_TOKEN}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN in environment 'cortex 1'."; exit 1; }
          test -n "${CF_ACCOUNT_ID}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID in environment 'cortex 1'."; exit 1; }
          echo "Cloudflare credentials are present."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=portfoliotranos --branch=main --commit-message="Deploy Tranos Studio"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
